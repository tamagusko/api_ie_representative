name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Monthly run to catch Oireachtas TD-data drift (by-elections, departures).
    - cron: "0 6 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # needed by the keep-alive step below
    steps:
      # GitHub disables scheduled workflows after 60 days without repo
      # activity. Re-enabling via the API resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ci.yml/enable"

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests (offline)
        run: uv run pytest

      - name: Integration tests (live Oireachtas feed)
        run: uv run pytest -m integration
